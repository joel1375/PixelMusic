name: Spotify-only APK
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speaker-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Test mixes and build Spotify-only APK
        run: ./gradlew :spotify:testDebugUnitTest :spotify:assembleRelease --stacktrace
      - name: Verify signature and Spotify-only package
        run: |
          APK=spotify/build/outputs/apk/release/spotify-release.apk
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only "$APK" > apk-packages.txt
          if grep -Ei 'newpipe|innertube|youtube|airsonic|exoplayer|telegram' apk-packages.txt; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: PixelMusic-Spotify-only
          path: spotify/build/outputs/apk/release/spotify-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotify-test-reports
          path: |
            spotify/build/reports/tests/
            apk-packages.txt
