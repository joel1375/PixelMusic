name: Speaker preview APK
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speaker-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect available Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list | awk "/platforms;android-|build-tools;/"'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Test sender and build APK
        timeout-minutes: 15
        run: ./gradlew :speaker-sender:testDebugUnitTest :app:assembleDebug --stacktrace -Ppixelmusic.enableAbiSplits=true -PAPP_VERSION_CODE=2 -PAPP_VERSION_NAME=1.0-speaker-preview-2
      - name: Test audio queue
        run: ./gradlew :app:testDebugUnitTest --tests 'com.unshoo.pixelmusic.data.service.speakers.PcmQueueTest' --stacktrace
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v7
        with:
          name: PixelMusic-speaker-preview-arm64
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: speaker-test-reports
          path: |
            speaker-sender/build/reports/tests/
            app/build/reports/tests/
